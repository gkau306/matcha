<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>café — matcha</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="detail-page">

  <!-- NAV -->
  <nav class="nav">
    <a href="/" class="nav-logo">m.</a>
    <div class="nav-links">
      <a href="/">← back to list</a>
    </div>
  </nav>

  <!-- DETAIL CONTENT -->
  <main id="cafe-detail" class="cafe-detail">
    <div class="loading" id="loading">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </main>

  <!-- REVIEW FORM -->
  <section class="review-section" id="review-section" style="display:none">
    <div class="review-form-container">
      <h3>leave a note</h3>
      <p class="review-sub">share what the matcha was like — be specific about flavour, sweetness, texture</p>
      <form id="review-form">
        <input type="text" id="review-author" placeholder="your name (optional)" />
        <textarea id="review-body" placeholder="e.g. super milky, slightly sweet, oat milk really works here — no bitterness at all…" required></textarea>
        <div class="review-form-footer">
          <div class="star-rating" id="star-rating">
            <span class="star" data-v="1">★</span>
            <span class="star" data-v="2">★</span>
            <span class="star" data-v="3">★</span>
            <span class="star" data-v="4">★</span>
            <span class="star" data-v="5">★</span>
          </div>
          <button type="submit" id="submit-review">submit</button>
        </div>
        <p id="review-error" class="form-error" style="display:none"></p>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">m.</div>
      <p class="footer-tagline">the matcha edit</p>
    </div>
  </footer>

  <script src="/cafe.js"></script>
</body>
</html>
